# Configuracao de split temporal
split:
  # Split estritamente temporal (sem leakage)
  train:
    end_year: 2021  # Treino: <= 2021 (expandido para incluir features novas)

  validation:
    start_year: 2022
    end_year: 2022  # Validacao: 2022 (ano da seca RS - caso mais dificil)

  test:
    start_year: 2023
    end_year: 2023  # Teste: 2023 (ultimo ano com dados reais)

  # Anos para inferencia futura
  inference:
    years: [2024, 2025]

  # Validacao de integridade
  checks:
    no_train_future_leak: true  # Nenhuma linha de treino com ano > train.end_year
    temporal_order: true        # train < validation < test
